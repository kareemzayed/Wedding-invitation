<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>دعوة زفاف | محمود & سهيلة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;500&family=Aref+Ruqaa:wght@400;700&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
    <style>
        /* ============ ١) الألوان والخطوط — عدّلها من هنا ============ */
        :root{
            --bg:#f6efe2; --bg2:#efe4cf;
            --env:#1f4a3d; --env-dark:#163628; --env-light:#2a5c4b;
            --gold:#b8914a; --gold-soft:#d4b57a; --gold-deep:#8f6c2e;
            --brown:#4a3426; --brown-soft:#7a604a;
            --rose:#e8b9bd; --rose-deep:#d79aa1;
            --f-quran:'Amiri Quran','Amiri',serif;
            --f-title:'Reem Kufi','Tajawal',sans-serif;
            --f-body:'Tajawal',sans-serif;
            --f-hand:'Aref Ruqaa','Amiri',serif;
            --f-en:'Cormorant Garamond',Georgia,serif;
        }
        *{box-sizing:border-box;margin:0;padding:0}
        html{-webkit-text-size-adjust:100%}
        body{
            font-family:var(--f-body);color:var(--brown);min-height:100vh;min-height:100dvh;
            background:
                    radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.7),transparent 60%),
                    repeating-linear-gradient(45deg,rgba(184,145,74,.025) 0 2px,transparent 2px 5px),
                    linear-gradient(180deg,var(--bg),var(--bg2));
            background-attachment:fixed;overflow-x:hidden;
        }
        body.locked{overflow:hidden;height:100dvh}
        :focus-visible{outline:2px solid var(--gold);outline-offset:4px}

        /* ذرات الضوء */
        #sparks{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
        .spark{position:absolute;bottom:-10px;width:4px;height:4px;border-radius:50%;
            background:radial-gradient(circle,#fff6d6,var(--gold-soft) 60%,transparent 70%);
            opacity:0;animation:rise linear infinite}
        @keyframes rise{0%{opacity:0;transform:translateY(0)}15%{opacity:.8}85%{opacity:.5}100%{opacity:0;transform:translateY(-105vh) translateX(20px)}}

        /* ============ ٢) شاشة الظرف ============ */
        #intro{
            position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;
            gap:clamp(18px,4.5vh,38px);padding:20px;cursor:pointer;-webkit-tap-highlight-color:transparent;
            background:radial-gradient(ellipse at 50% 40%,#fbf6ea,var(--bg) 55%,var(--bg2));
            transition:opacity 1.2s ease,visibility 1.2s;
        }
        #intro.gone{opacity:0;visibility:hidden;pointer-events:none}
        .bismillah{font-family:var(--f-quran);font-size:clamp(28px,8vw,46px);color:var(--gold-deep);
            text-shadow:0 1px 0 #fff8,0 2px 8px rgba(184,145,74,.3);text-align:center;line-height:1.6;transition:opacity .8s}
        .bismillah::after{content:"";display:block;width:90px;height:1px;margin:6px auto 0;
            background:linear-gradient(90deg,transparent,var(--gold),transparent)}

        .scene{perspective:1100px;width:min(86vw,380px);aspect-ratio:3/2;position:relative;margin-top:30px}
        .envelope{position:absolute;inset:0;transform-style:preserve-3d;
            filter:drop-shadow(0 22px 22px rgba(60,40,20,.28)) drop-shadow(0 4px 6px rgba(60,40,20,.2));
            transition:transform 1.4s cubic-bezier(.6,.05,.3,1)}
        .env-back{position:absolute;inset:0;border-radius:6px;background:linear-gradient(160deg,var(--env-light),var(--env-dark));
            box-shadow:inset 0 0 0 1.5px var(--gold),inset 0 0 0 5px var(--env-dark),inset 0 0 0 6px rgba(212,181,122,.5)}
        /* البطاقة داخل الظرف */
        .card{position:absolute;left:6%;right:6%;top:6%;bottom:6%;border-radius:4px;z-index:2;
            background:linear-gradient(180deg,#fffaf0,#f3e8d2);box-shadow:0 0 0 1px var(--gold-soft),0 2px 10px rgba(0,0,0,.15);
            display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--gold-deep);
            transition:transform 1.5s cubic-bezier(.45,.05,.2,1) .9s,opacity .6s}
        .card::before{content:"";position:absolute;inset:6px;border:1px solid var(--gold-soft);border-radius:2px}
        .card .en{font-family:var(--f-en);font-weight:700;font-size:clamp(20px,6vw,28px);direction:ltr;letter-spacing:.08em}
        .card .ar{font-family:var(--f-title);font-size:clamp(14px,4vw,18px)}
        .card .sheen{position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.8) 50%,transparent 65%);
            transform:translateX(120%);border-radius:4px}
        /* الجيب الأمامي */
        .pocket{position:absolute;inset:0;z-index:3;pointer-events:none}
        .pocket i{position:absolute;inset:0;background:linear-gradient(160deg,var(--env-light),var(--env))}
        .pocket .l{clip-path:polygon(0 0,52% 56%,0 100%);filter:brightness(.93)}
        .pocket .r{clip-path:polygon(100% 0,48% 56%,100% 100%);filter:brightness(.88)}
        .pocket .b{clip-path:polygon(0 100%,50% 52%,100% 100%);background:linear-gradient(0deg,var(--env-dark),var(--env))}
        .pocket::after{content:"";position:absolute;inset:0;border-radius:6px;box-shadow:inset 0 0 0 1.5px var(--gold)}
        /* الغطاء */
        .flap{position:absolute;left:0;right:0;top:0;height:58%;z-index:4;transform-origin:50% 0;transform-style:preserve-3d;
            transition:transform 1.1s cubic-bezier(.5,0,.25,1)}
        .flap i{position:absolute;inset:0;clip-path:polygon(0 0,100% 0,50% 100%);backface-visibility:hidden;
            background:linear-gradient(180deg,var(--env-light),var(--env))}
        .flap i.in{transform:rotateX(180deg);background:linear-gradient(0deg,var(--env-dark),#12301f)}
        .flap::after{content:"";position:absolute;inset:0;clip-path:polygon(0 0,100% 0,50% 100%);
            background:linear-gradient(var(--gold),var(--gold)) ;opacity:0}
        .flap-edge{position:absolute;left:0;right:0;top:0;height:100%;z-index:5;pointer-events:none;backface-visibility:hidden}
        .seal{position:absolute;left:50%;top:58%;width:clamp(62px,19vw,84px);aspect-ratio:1;z-index:6;
            transform:translate(-50%,-50%);border-radius:50% 48% 52% 50%/50% 52% 48% 50%;
            background:radial-gradient(circle at 32% 28%,#f7ecc9,var(--gold-soft) 45%,var(--gold-deep) 100%);
            box-shadow:0 5px 10px rgba(0,0,0,.4),inset 0 2px 3px #fff9,inset 0 -3px 6px rgba(80,50,10,.45);
            display:flex;align-items:center;justify-content:center;transition:transform 1s ease,opacity .7s ease}
        .seal::before{content:"";position:absolute;inset:7px;border-radius:50%;border:1.5px solid rgba(110,75,20,.5);
            box-shadow:0 1px 0 #fff7 }
        .seal span{font-family:var(--f-en);font-weight:700;color:#6a4a16;direction:ltr;font-size:clamp(15px,4.6vw,21px);
            text-shadow:0 1px 0 #fff8,0 -1px 0 rgba(60,35,5,.35);letter-spacing:.02em;position:relative}
        .glow{position:absolute;left:50%;top:50%;width:140%;aspect-ratio:1;transform:translate(-50%,-50%);opacity:0;z-index:7;pointer-events:none;
            background:radial-gradient(circle,rgba(255,236,170,.9),rgba(255,236,170,0) 60%);transition:opacity .9s}

        /* حالة الفتح */
        #intro.opening .seal{transform:translate(-50%,-50%) scale(.6) translateY(-30px);opacity:0}
        #intro.opening .flap{transform:rotateX(180deg)}
        #intro.opening .glow{opacity:.75}
        #intro.opening .card{transform:translateY(-62%) scale(1.04)}
        #intro.opening .card .sheen{animation:sheen 1.6s ease 1.8s forwards}
        #intro.opening .tap,#intro.opening .bismillah{opacity:0}
        #intro.flipped .flap{z-index:1}
        #intro.leaving .envelope{transform:translateY(-8vh) scale(1.35) rotateX(8deg)}
        #intro.leaving .card{transform:translateY(-62%) scale(1.12)}
        @keyframes sheen{to{transform:translateX(-120%)}}

        .tap{font-family:var(--f-title);font-size:clamp(17px,5vw,22px);color:var(--gold-deep);
            text-shadow:0 0 12px rgba(212,181,122,.9),0 0 26px rgba(212,181,122,.5);animation:pulse 2.6s ease-in-out infinite;transition:opacity .6s}
        @keyframes pulse{0%,100%{opacity:.35;text-shadow:0 0 4px rgba(212,181,122,.3)}50%{opacity:1;text-shadow:0 0 14px #e6c987,0 0 30px rgba(212,181,122,.8)}}

        /* ============ ٣) الدعوة ============ */
        #invite{position:relative;z-index:1;display:none;opacity:0;transition:opacity 1.6s ease}
        #invite.show{display:block}
        #invite.visible{opacity:1}
        .wrap{max-width:560px;margin:0 auto;padding:0 22px;text-align:center}
        .sec{padding:clamp(34px,7vh,60px) 0}
        .rv{opacity:0;transform:translateY(22px);transition:opacity 1.1s ease,transform 1.1s cubic-bezier(.2,.7,.2,1)}
        .rv.in{opacity:1;transform:none}
        .d1{transition-delay:.15s}.d2{transition-delay:.3s}.d3{transition-delay:.45s}

        .frame-top{padding-top:calc(44px + env(safe-area-inset-top,0px))}
        .ayah{font-family:var(--f-quran);font-size:clamp(25px,7vw,34px);line-height:2.15;color:var(--brown);position:relative;padding:18px 6px}
        .ayah::before,.ayah::after{content:"";position:absolute;left:12%;right:12%;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
        .ayah::before{top:0}.ayah::after{bottom:0}
        .roses{display:flex;justify-content:center;gap:clamp(14px,5vw,26px);margin-top:28px}
        .roses svg{width:clamp(38px,11vw,50px);height:auto;animation:sway 6s ease-in-out infinite}
        .roses svg:nth-child(2){animation-delay:-2s;transform:translateY(-6px)}
        .roses svg:nth-child(3){animation-delay:-4s}
        @keyframes sway{0%,100%{rotate:-3deg}50%{rotate:3deg}}

        .orn{display:flex;align-items:center;justify-content:center;gap:12px;color:var(--gold)}
        .orn::before,.orn::after{content:"";height:1px;width:clamp(40px,14vw,80px);background:linear-gradient(90deg,transparent,var(--gold))}
        .orn::after{transform:scaleX(-1)}
        .orn b{width:7px;height:7px;background:var(--gold);transform:rotate(45deg);display:block}
        h1,h2{font-family:var(--f-title);font-weight:700;color:var(--gold-deep)}
        h1{font-size:clamp(36px,11vw,54px);margin:14px 0}
        h2{font-size:clamp(30px,9vw,42px);margin:14px 0}
        .lead{font-size:clamp(17px,4.6vw,20px);line-height:2;color:var(--brown-soft)}
        .names{font-family:var(--f-title);font-weight:700;font-size:clamp(44px,14vw,68px);color:var(--brown);line-height:1.35;
            margin:18px 0;display:flex;align-items:center;justify-content:center;gap:clamp(10px,3vw,20px);flex-wrap:wrap}
        .names em{font-style:normal;font-family:var(--f-en);color:var(--gold);font-size:.75em}
        .rings{width:clamp(130px,38vw,180px);margin:18px auto 6px;display:block;filter:drop-shadow(0 6px 8px rgba(120,85,30,.3))}
        .rings .r1{animation:spin1 9s ease-in-out infinite;transform-origin:78px 80px}
        .rings .r2{animation:spin1 9s ease-in-out infinite reverse;transform-origin:122px 80px}
        @keyframes spin1{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}
        .romantic{font-family:var(--f-hand);font-size:clamp(21px,6vw,27px);color:var(--brown-soft);margin-top:14px}

        .photo{margin:26px auto 0;border-radius:18px;padding:5px;background:linear-gradient(145deg,var(--gold-soft),var(--gold-deep),var(--gold-soft));
            box-shadow:0 18px 34px rgba(80,55,25,.28)}
        .photo img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px;background:#2a2118}

        .details{display:grid;gap:14px;margin-top:8px}
        .item{display:flex;align-items:center;gap:16px;padding:16px 20px;text-align:right;border-radius:16px;
            background:linear-gradient(180deg,rgba(255,255,255,.7),rgba(255,250,238,.5));
            border:1px solid rgba(184,145,74,.55);box-shadow:0 6px 16px rgba(120,90,40,.1)}
        .item svg{flex:none;width:34px;height:34px;stroke:var(--gold-deep);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
        .item small{display:block;font-size:14px;color:var(--gold-deep);margin-bottom:2px}
        .item strong{font-family:var(--f-title);font-weight:500;font-size:clamp(20px,5.6vw,24px);color:var(--brown)}
        .item span.s{display:block;font-size:16px;color:var(--brown-soft);margin-top:2px}
        .addr{margin-top:14px;padding:18px;border:1.5px dashed var(--gold);border-radius:16px;font-size:clamp(17px,4.6vw,19px);line-height:2.1;color:var(--brown)}
        .btn{display:inline-flex;align-items:center;gap:10px;margin-top:22px;padding:15px 30px;border-radius:999px;text-decoration:none;
            font-family:var(--f-title);font-size:clamp(17px,4.8vw,19px);color:#fff9ea;
            background:linear-gradient(135deg,var(--env-light),var(--env-dark));box-shadow:0 8px 18px rgba(31,74,61,.35),inset 0 0 0 1.5px var(--gold);
            transition:transform .35s,box-shadow .35s,background .35s}
        .btn:hover,.btn:focus-visible{transform:translateY(-3px);box-shadow:0 14px 24px rgba(31,74,61,.4),inset 0 0 0 1.5px var(--gold-soft)}
        .btn svg{width:22px;height:22px;stroke:var(--gold-soft);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
        .closing{font-family:var(--f-hand);font-size:clamp(25px,7.2vw,34px);line-height:2;color:var(--gold-deep);padding:10px 0 calc(70px + env(safe-area-inset-bottom,0px))}
        .leaf{width:120px;margin:0 auto 8px;display:block;stroke:var(--gold);fill:none;stroke-width:1.4;stroke-linecap:round}

        /* زر الصوت الثابت */
        #soundBtn{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;width:54px;height:54px;border-radius:50%;
            display:none;align-items:center;justify-content:center;cursor:pointer;border:1.5px solid var(--gold);
            background:linear-gradient(135deg,var(--env-light),var(--env-dark));box-shadow:0 8px 18px rgba(31,74,61,.4);
            opacity:0;transition:opacity 1.2s ease,transform .3s;-webkit-tap-highlight-color:transparent}
        #soundBtn.show{display:flex}
        #soundBtn.visible{opacity:1}
        #soundBtn:hover{transform:scale(1.07)}
        #soundBtn svg{width:26px;height:26px;stroke:var(--gold-soft);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
        #soundBtn .slash{display:none;stroke:#f0c9c9}
        #soundBtn.muted .slash{display:block}
        #soundBtn.muted .mic{opacity:.55}
        #soundBtn:not(.muted)::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1px solid var(--gold-soft);animation:ring 2.6s ease-out infinite}
        @keyframes ring{0%{opacity:.7;transform:scale(.9)}100%{opacity:0;transform:scale(1.3)}}

        @media (prefers-reduced-motion:reduce){
            *,*::before,*::after{animation:none!important;transition-duration:.01ms!important;transition-delay:0s!important}
            .rv{opacity:1;transform:none}
            .tap{opacity:1}
        }
    </style>
</head>
<body class="locked">
<div id="sparks" aria-hidden="true"></div>

<!-- ======== شاشة الظرف ======== -->
<div id="intro" role="button" tabindex="0" aria-label="اضغط لفتح الدعوة">
    <div class="bismillah" data-k="bismillah"></div>
    <div class="scene">
        <div class="envelope" id="envelope">
            <div class="env-back"></div>
            <div class="card">
                <span class="en" data-k="monogram"></span>
                <span class="ar" data-k="cardLine"></span>
                <div class="sheen"></div>
            </div>
            <div class="pocket"><i class="l"></i><i class="r"></i><i class="b"></i></div>
            <div class="flap"><i></i><i class="in"></i></div>
            <div class="seal"><span data-k="monogram"></span></div>
            <div class="glow"></div>
        </div>
    </div>
    <div class="tap" data-k="tapText"></div>
</div>

<!-- ======== الدعوة ======== -->
<main id="invite">
    <div class="wrap">

        <section class="sec frame-top">
            <p class="ayah rv" data-k="ayah"></p>
            <div class="roses rv d1" aria-hidden="true" id="roses"></div>
        </section>

        <section class="sec">
            <div class="orn rv"><b></b></div>
            <h1 class="rv d1" data-k="title"></h1>
            <div class="orn rv d1"><b></b></div>
            <p class="lead rv d2" style="margin-top:18px" data-k="invText"></p>

            <div class="names rv d1" aria-label="العروسان">
                <span data-k="groom"></span><em>&amp;</em><span data-k="bride"></span>
            </div>

            <svg class="rings rv d2" viewBox="0 0 200 160" aria-hidden="true">
                <defs>
                    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0" stop-color="#f4e4b4"/><stop offset=".5" stop-color="#c9a257"/><stop offset="1" stop-color="#8f6c2e"/>
                    </linearGradient>
                    <radialGradient id="dm" cx=".35" cy=".3"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#bfe3ee"/></radialGradient>
                </defs>
                <g fill="none" stroke="url(#g)" stroke-linecap="round">
                    <circle class="r1" cx="78" cy="88" r="46" stroke-width="9"/>
                    <circle class="r2" cx="122" cy="88" r="46" stroke-width="9"/>
                    <circle cx="78" cy="88" r="46" stroke="#fff6" stroke-width="1.5" transform="translate(0,-2)"/>
                </g>
                <path d="M100 133a46 46 0 0 1-22-5" fill="none" stroke="url(#g)" stroke-width="9"/>
                <path d="M88 26l8-9h8l8 9-12 14z" fill="url(#dm)" stroke="#8f6c2e" stroke-width="1.2" transform="translate(-4,-4)"/>
            </svg>
            <p class="romantic rv d3" data-k="romantic"></p>
        </section>

        <section class="sec">
            <div class="orn rv"><b></b></div>
            <h2 class="rv d1" data-k="weddingTitle"></h2>
            <div class="orn rv d1"><b></b></div>
            <figure class="photo rv d2"><img id="hall" alt="قاعة الزفاف" loading="lazy"></figure>
        </section>

        <section class="sec" style="padding-top:10px">
            <div class="details">
                <div class="item rv">
                    <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
                    <div><small>التاريخ</small><strong data-k="date"></strong></div>
                </div>
                <div class="item rv d1">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
                    <div><small>الموعد</small><strong data-k="time"></strong></div>
                </div>
                <div class="item rv d2">
                    <svg viewBox="0 0 24 24"><path d="M12 22s7-6.5 7-12a7 7 0 1 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="10" r="2.6"/></svg>
                    <div><small>المكان</small><strong data-k="venue"></strong><span class="s" data-k="street"></span></div>
                </div>
            </div>
            <div class="addr rv" data-k-html="address"></div>
            <a class="btn rv d1" id="mapBtn" target="_blank" rel="noopener noreferrer">
                <svg viewBox="0 0 24 24"><path d="M9 4 3 6.5v14L9 18l6 2.5 6-2.5v-14L15 6.5z"/><path d="M9 4v14M15 6.5v14"/></svg>
                <span data-k="mapText"></span>
            </a>
        </section>

        <section class="sec">
            <svg class="leaf rv" viewBox="0 0 120 24" aria-hidden="true"><path d="M4 12h40M76 12h40"/><path d="M60 3c6 5 6 13 0 18-6-5-6-13 0-18zM48 12c4-5 8-5 12 0M72 12c-4-5-8-5-12 0"/></svg>
            <p class="closing rv d1" data-k="closing"></p>
        </section>
    </div>
</main>

<audio id="bgAudio" preload="auto" playsinline></audio>
<button id="soundBtn" type="button" aria-label="كتم الصوت" aria-pressed="false">
    <svg viewBox="0 0 24 24" aria-hidden="true">
        <g class="mic"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/></g>
        <path class="slash" d="M4 4l16 16"/>
    </svg>
</button>

<script>
    /* ============ ٤) كل النصوص والبيانات القابلة للتعديل ============ */
    const CONFIG = {
        bismillah: "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ",
        monogram:  "M & S",                       // الحرف الأول من العريس والعروس
        cardLine:  "دعوة زفاف",
        tapText:   "اضغط لفتح الدعوة",
        ayah:      "﴿وَمِنْ آيَاتِهِ أَنْ خَلَقَ لَكُم مِّنْ أَنْفُسِكُمْ أَزْوَاجًا لِّتَسْكُنُوا إِلَيْهَا وَجَعَلَ بَيْنَكُم مَّوَدَّةً وَرَحْمَةً ۚ﴾",
        title:     "دعوة زفاف",
        invText:   "تتشرف عائلتانا بدعوتكم الكريمة لمشاركتنا فرحتنا.",
        groom:     "محمود",
        bride:     "سهيلة",
        romantic:  "تكتمل فرحتنا بوجودكم معنا.",
        weddingTitle: "حفل الزفاف",
        date:      "الخميس 05/11/2026",
        time:      "الساعة 8 مساءً",
        venue:     "قرية تاج الملوك - Tag El Melouk Village\n",
        street:    "قرية تلوانة",
        address:   ["قرية تلوانة، محافظة المنوفية", "الباجور", "بجوار نزلة الاقليمي"],
        mapText:   "فتح الموقع على خرائط جوجل",
        mapUrl:    "https://maps.app.goo.gl/LrUh3pKeTTaZt8Z89",
        hallImage: "1793575783347.jpeg",
        audio:     "ayah.mp3",                      // ملف الصوت (ضعه بجوار الملف باسم ayah.mp3 أو غيّر الاسم هنا)
        audioLoop: true,                            // true = يعيد التشغيل تلقائيًا، false = مرة واحدة
        audioVolume: 0.9,                           // من 0 إلى 1
        closing:   "حضوركم أجمل هدية تملأ قلوبنا بهجةً وفرحةً.",
        sparks:    400                              // عدد لمعات الذهب الخلفية (0 لإيقافها)
    };

    /* ---------- تعبئة النصوص ---------- */
    document.querySelectorAll('[data-k]').forEach(el => el.textContent = CONFIG[el.dataset.k]);
    document.querySelectorAll('[data-k-html]').forEach(el => {
        el.innerHTML = '';
        CONFIG[el.dataset.kHtml].forEach((line,i,a) => {
            el.append(document.createTextNode(line)); if(i < a.length-1) el.append(document.createElement('br'));
        });
    });
    document.getElementById('mapBtn').href = CONFIG.mapUrl;

    /* صورة مؤقتة للقاعة (SVG) */
    const placeholder = 'data:image/svg+xml;utf8,' + encodeURIComponent(
        `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600"><defs>
<radialGradient id="a" cx=".5" cy=".3" r=".8"><stop offset="0" stop-color="#6b4a26"/><stop offset="1" stop-color="#1f1710"/></radialGradient>
<radialGradient id="l"><stop offset="0" stop-color="#fff3c4"/><stop offset="1" stop-color="#fff3c400"/></radialGradient></defs>
<rect width="800" height="600" fill="url(#a)"/>
<g fill="none" stroke="#c9a257" stroke-width="3" opacity=".7"><path d="M80 600V260a70 70 0 0 1 140 0v340M330 600V240a70 70 0 0 1 140 0v360M580 600V260a70 70 0 0 1 140 0v340"/></g>
<g stroke="#e6c987" stroke-width="2"><path d="M400 0v110M200 0v80M600 0v80"/></g>
<g fill="url(#l)"><circle cx="400" cy="150" r="90"/><circle cx="200" cy="110" r="60"/><circle cx="600" cy="110" r="60"/></g>
<g fill="#f6e3a3"><path d="M360 120h80l-14 60h-52z"/><path d="M180 90h40l-8 40h-24zM580 90h40l-8 40h-24z"/></g>
<rect y="520" width="800" height="80" fill="#2b1f14"/>
<text x="400" y="565" fill="#c9a257" font-size="26" text-anchor="middle" font-family="serif">ضع صورة القاعة هنا — CONFIG.hallImage</text></svg>`);
    document.getElementById('hall').src = CONFIG.hallImage || placeholder;

    /* ---------- الورود (ثلاث وردات SVG) ---------- */
    const rose = `<svg viewBox="0 0 60 70"><path d="M30 40c0 12-2 20-2 26" stroke="#8f9a6a" stroke-width="2" fill="none"/>
<path d="M30 56c8-8 14-6 16-6-2 6-10 9-16 6z" fill="#a9b383"/>
<g><circle cx="30" cy="22" r="19" fill="#e8b9bd"/>
<path d="M14 20c2-9 12-14 20-11 8 3 11 10 9 16-2 7-10 11-18 9-7-2-12-8-11-14z" fill="#f4d3d6"/>
<path d="M22 18c2-6 10-7 14-2 3 4 1 10-4 12-5 1-10-3-10-10z" fill="#e8b9bd" stroke="#d79aa1" stroke-width=".8"/>
<path d="M26 20c1-3 6-4 8-1 2 3-1 6-4 6-3 0-5-2-4-5z" fill="#d79aa1"/>
<circle cx="30" cy="22" r="19" fill="none" stroke="#b8914a" stroke-width="1" opacity=".6"/></g></svg>`;
    document.getElementById('roses').innerHTML = rose.repeat(3);

    /* ---------- لمعات ذهبية ---------- */
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(!reduce){
        const box = document.getElementById('sparks');
        for(let i=0;i<CONFIG.sparks;i++){
            const s = document.createElement('i'); s.className='spark';
            s.style.cssText = `left:${Math.random()*100}%;animation-duration:${14+Math.random()*14}s;animation-delay:${-Math.random()*20}s;transform:scale(${.6+Math.random()})`;
            box.appendChild(s);
        }
    }

    /* ---------- الصوت وزر الكتم ---------- */
    const audio = document.getElementById('bgAudio'), soundBtn = document.getElementById('soundBtn');
    let audioOK = !!CONFIG.audio;
    audio.src = CONFIG.audio; audio.loop = CONFIG.audioLoop; audio.volume = CONFIG.audioVolume;
    audio.addEventListener('error', () => { audioOK = false; soundBtn.classList.remove('show'); });  // لو الملف غير موجود يختفي الزر
    function setMuted(m){
        audio.muted = m;
        soundBtn.classList.toggle('muted', m);
        soundBtn.setAttribute('aria-pressed', m);
        soundBtn.setAttribute('aria-label', m ? 'تشغيل الصوت' : 'كتم الصوت');
    }
    function playAudio(){ if(!audioOK) return; const p = audio.play(); if(p && p.catch) p.catch(()=>setMuted(true)); }
    soundBtn.addEventListener('click', () => {
        const m = !audio.muted; setMuted(m);
        if(!m && audio.paused) playAudio();
    });

    /* ---------- فتح الظرف (مرة واحدة فقط) ---------- */
    const intro = document.getElementById('intro'), invite = document.getElementById('invite');
    let opened = false;
    function openEnvelope(){
        if(opened) return; opened = true;                       // تمنع إعادة التشغيل بالضغط العشوائي
        playAudio();                                            // يبدأ الصوت مباشرة مع أول ضغطة
        intro.removeAttribute('tabindex'); intro.style.cursor = 'default';
        const t = reduce ? 0.05 : 1;
        intro.classList.add('opening');
        setTimeout(()=> intro.classList.add('flipped'), 520*t);   // الغطاء يمر خلف البطاقة
        setTimeout(()=> intro.classList.add('leaving'), 3000*t);  // اقتراب نحو البطاقة
        setTimeout(()=>{
            invite.classList.add('show'); window.scrollTo(0,0);
            requestAnimationFrame(()=>requestAnimationFrame(()=>{ invite.classList.add('visible'); intro.classList.add('gone'); }));
            document.body.classList.remove('locked');
            if(audioOK){ soundBtn.classList.add('show'); requestAnimationFrame(()=>requestAnimationFrame(()=>soundBtn.classList.add('visible'))); }
            startReveal();
        }, 3900*t);
        setTimeout(()=> intro.remove(), 5400*t+200);
    }
    intro.addEventListener('click', openEnvelope);
    intro.addEventListener('keydown', e => { if(e.key==='Enter' || e.key===' '){ e.preventDefault(); openEnvelope(); }});
    intro.focus({preventScroll:true});

    /* ---------- ظهور تدريجي أثناء التمرير ---------- */
    function startReveal(){
        const els = document.querySelectorAll('.rv');
        if(!('IntersectionObserver' in window)){ els.forEach(e=>e.classList.add('in')); return; }
        const io = new IntersectionObserver(es => es.forEach(e => {
            if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); }
        }), {threshold:.15, rootMargin:'0px 0px -6% 0px'});
        els.forEach(e => io.observe(e));
    }
</script>
</body>
</html>
